<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spacebar Kiosk</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <main id="app" class="app">
      <section class="status-screen">
        <h1>Spacebar Kiosk</h1>
        <p>Starting up...</p>
      </section>
    </main>
    <!-- Outside #app so it is not affected by the a11y scale transform -->
    <button class="a11y-btn" id="a11y-btn" title="Accessibility mode" aria-label="Accessibility mode">♿</button>
    <!-- Maintenance overlay: shown when OMS puts the bar into maintenance mode -->
    <div id="maintenance-overlay" hidden aria-live="assertive">
      <p class="maintenance-title">TERMINAL OFFLINE</p>
      <p class="maintenance-sub">FACILITY CLOSED — STAND BY</p>
      <p id="maintenance-reopen" class="maintenance-reopen" hidden></p>
      <!-- Hidden staff control: tap "TERMINAL OFFLINE" 3x within 10s to reveal,
           only when this closure was auto-triggered by a print failure (not
           a genuine OMS-driven closure). See app.js. -->
      <button id="printer-lockout-clear" class="printer-lockout-clear" hidden>Staff: printer fixed, resume service</button>
    </div>
    <!-- CRT overlay: persistent scanlines + intermittent rolling band -->
    <div class="crt-overlay" id="crt-overlay" aria-hidden="true"></div>
    <script type="module" src="/app.js"></script>
    <!-- SVG spray-paint filter — used by .space-graffiti and .sleep-title-unofficial -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <filter id="spray-paint" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <!-- CRT sync-bar edge distortion: horizontal displacement via fractal noise -->
        <filter id="crt-noise" x="-5%" y="-300%" width="110%" height="700%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="3" seed="13" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="38" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <!-- CRT animated grain: cycling seed produces frame-by-frame noise flicker -->
        <filter id="crt-grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.80" numOctaves="1" stitchTiles="stitch" result="noise">
            <animate attributeName="seed" values="0;5;11;3;14;8;2;9;6;13;1;7;12;4;10;15" dur="0.5s" repeatCount="indefinite" calcMode="discrete"/>
          </feTurbulence>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
      </defs>
    </svg>
  </body>
</html>
